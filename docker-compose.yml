name: kakeibo
services:
  postgres:
    image: postgres:17-alpine
    container_name: kakeibo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: kakeibo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - kakeibo-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kakeibo"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - kakeibo-network

  redis:
    image: redis:8-alpine
    container_name: kakeibo-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - kakeibo-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis-commander:
    image: rediscommander/redis-commander
    depends_on:
      redis:
        condition: service_healthy
    ports:
     - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    networks:
      - kakeibo-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: kakeibo-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "3000:3000"

    env_file:
      - .env

    volumes:
      - .:/app
      - /app/node_modules

    networks:
      - kakeibo-network

volumes:
  postgres_data:
  redis_data:

networks:
  kakeibo-network:
    driver: bridge